<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine erste Seite</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 80px auto;
            text-align: center;
            background-color: #f5f5f5;
            color: #333;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 16px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        button {
            padding: 12px 28px;
            font-size: 1rem;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #3730a3;
        }
    </style>
</head>
<body>
    <h1>Willkommen auf meiner Seite</h1>
    <p>Dies ist ein kurzer Beispieltext. Klicke auf den Button unten, um eine Nachricht zu erhalten.</p>
    <button onclick="alert('Hallo! Du hast den Button geklickt.')">Klick mich</button>
</body>
</html>
