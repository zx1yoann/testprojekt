    this.usedRevive = false;
    this.skin = Save.data.skin;
    // Vorab gewonnene Power-Ups werden beim Start eingeloest.
    for (const id in Save.data.charges) {
      while (Save.data.charges[id] > 0) {
        Save.data.charges[id]--;
        this.applyPower(id, true);
      }
    }
    if (Object.keys(Save.data.charges).length) Save.commit();
  },
  currentScore() {
    return this.blackout ? Math.floor(this.dist * 2.5)
                         : Math.floor(this.dist + this.coins * 10);
  },
  openPause() {
    App.openPopup(new Popup("PAUSE",
      ["Strecke: " + Math.floor(this.dist) + " M", "Punkte: " + this.currentScore()],
      [["CONTINUE", "resume", C.lime], ["NEU STARTEN", "restart", C.amber], ["QUIT", "menu", C.magenta]],
      C.lime, 236, "resume"));
  },
  popupAction(a) {
    if (a === "resume") { App.closePopup(); this.countdown = Math.max(this.countdown, 100); }
    else if (a === "restart") { App.closePopup(); this.enter({ mode: this.mode }); }
    else if (a === "menu") { App.closePopup(); App.go("menu"); }
    else if (a === "revive") { App.closePopup(); this.doRevive(); }
    else if (a === "giveup") { App.closePopup(); this.finish(); }
  },
  doRevive() {
    Save.data.revives--; Save.commit();
    this.usedRevive = true;
    this.player.state = "run"; this.player.height = 0; this.player.vy = 0;
    this.player.inv = 150; this.player.crashT = 0;
    this.objs = this.objs.filter(o => o.z > 26);
    if (this.blackout) this.battery = BATTERY_MAX * 0.7;
    this.blind = 0; this.countdown = 110;
    Sound.play("fanfare"); App.toast("REVIVE EINGESETZT", C.cyan);
  },
  update(actions) {
    this.frames++;
    for (const a of actions) {
      if (a === "pause" || a === "back") { if (!this.done) this.openPause(); return; }
      if (a === "mute") { toggleMute(); continue; }
      if (a === "full") { toggleFullscreen(); continue; }
      if (typeof a === "object") {
        if (a.type === "tap") this.tryPunch();     // Tippen = Punch (Touch)
        continue;
      }
      if (this.countdown > 0 || this.player.state === "crash") continue;
      if (a === "left")  { if (this.player.move(-1)) Sound.play("hover"); }
      else if (a === "right") { if (this.player.move(1)) Sound.play("hover"); }
      else if (a === "up") { if (this.player.jump()) Sound.play("jump"); }
      else if (a === "down") { if (this.player.duck()) Sound.play("slide"); }
      else if (a === "punch") this.tryPunch();
    }
    if (this.countdown > 0) { this.countdown--; return; }
    if (this.player.state === "crash") { this.updateCrash(); return; }

    const slow = this.effects.slowmo ? 0.45 : 1;
    this.speed = (BASE_SPEED + this.dist * SPEED_RAMP) * slow;   // ohne Obergrenze
    if (this.blackout) this.speed *= 0.82;
    if (this.effects.boost) this.speed *= 1.45;

    /* Bei hohem Tempo in mehreren kleinen Schritten rechnen. Sonst koennte
       ein Objekt die Trefferzone in einem einzigen Frame ueberspringen. */
    const steps = Math.max(1, Math.ceil(this.speed / 0.8));
    const sub = this.speed / steps;
    for (let i = 0; i < steps; i++) {
      this.dist += sub; this.scroll += sub;
      for (const o of this.objs) o.advance(sub);
      for (const p of this.picks) p.advance(sub);
      this.checkObstacles();
      this.checkPicks();
      if (this.player.state === "crash") break;
    }
    const land = this.player.update(this.speed);
    if (land === "land") Sound.play("land");
    this.gen.spawn(this.dist, this.speed, this.objs, this.picks);
    this.objs = this.objs.filter(o => o.alive || o.smashed > 0);
    for (const o of this.objs) if (o.smashed > 0 && ++o.smashed > 12) o.alive = false;
    this.objs = this.objs.filter(o => o.alive);
    this.picks = this.picks.filter(p => p.alive);
    for (const k in this.effects) if (--this.effects[k] <= 0) {
      delete this.effects[k]; App.toast(POWERS[k].name + " VORBEI", C.grey);
    }
    if (this.blackout) this.updateBattery();
    this.updateParts();
    if (this.hitFlash > 0) this.hitFlash--;
    this.score = this.currentScore();
  },
  tryPunch() {
    if (this.countdown > 0 || this.player.state === "crash") return;
    if (!this.player.punch()) { if (this.player.cool > 0) Sound.play("whiff"); return; }
    Sound.play("punch");
    // Alles Zerschlagbare in Reichweite der eigenen Spur zerlegen.
    let hits = 0;
    for (const o of this.objs) {
      if (!o.alive || o.smashed > 0 || !o.def.punchable) continue;
      if (o.lane !== this.player.lane) continue;
      if (o.z > PUNCH_REACH_Z || o.z + o.def.depth < HIT_MIN) continue;
      o.smashed = 1; hits++;
      const rw = o.def.reward || {};
      const gain = (rw.coins || 0) * (this.effects.double ? 2 : 1);
      this.coins += gain;
      this.dist += (rw.score || 0) / 3;
      if (this.blackout) this.battery = Math.min(BATTERY_MAX, this.battery + gain * BATTERY_COIN);
      this.player.combo++; this.player.comboT = 150;
      this.burst(o, C.lime, 18);
    }
    if (hits) {
      Sound.play("smash"); this.hitFlash = 6; this.shake = 5;
      if (this.player.combo > 1) App.toast("COMBO x" + this.player.combo, C.lime);
    }
  },
  checkObstacles() {
    const p = this.player;
    for (const o of this.objs) {
      if (!o.alive || o.smashed > 0 || !o.inHit() || o.lane !== p.lane) continue;
      if (this.effects.boost && o.def.punchable) {       // Boost walzt Kisten um
        o.smashed = 1; this.coins += (o.def.reward?.coins || 0);
        this.burst(o, C.cyan, 14); Sound.play("smash"); continue;
      }
      if (!o.def.blocks({ height: p.height, head: p.head })) continue;
      if (this.effects.boost) { o.smashed = 1; this.burst(o, C.cyan, 10); continue; }
      const hadShield = p.shield;
      if (p.hurt()) {
        Sound.play("crash"); this.shake = 9; this.burstAt(C.magenta, 26);
      } else if (hadShield) {
        Sound.play("power"); App.toast("SCHILD VERBRAUCHT", C.lime);
        this.shake = 4; this.burstAt(C.lime, 14); o.alive = false;
      }
      return;
    }
  },
  checkPicks() {
    const p = this.player, magnet = !!this.effects.magnet;
    for (const pk of this.picks) {
      if (!pk.alive) continue;
      if (magnet && pk.type === "coin" && pk.z < 26) pk.attract(p.lane);
      if (!pk.inHit()) continue;
      if (Math.abs(pk.lane - p.lane) >= 0.55) continue;
      if (Math.abs(p.height - pk.h) > REACH) continue;
      pk.alive = false;
      if (pk.type === "coin") this.collectCoin();
      else this.applyPower(pk.type);
    }
  },
  collectCoin() {
    const n = this.effects.double ? 2 : 1;
    this.coins += n; Sound.play("coin"); this.burstAt(C.amber, 4);
    if (this.blackout) {
      this.battery = Math.min(BATTERY_MAX, this.battery + BATTERY_COIN * n);
      if (this.battery > 35) this.warned = false;
      if (this.blind > 0) { this.blind = 0; App.toast("LICHT WIEDER DA", C.lime); }
    }
  },
  applyPower(id, silent) {
    const def = POWERS[id];
    if (!silent) { Sound.play("power"); this.burstAt(def.color, 16); }
    App.toast(def.name + (silent ? " (AUS DEM RAD)" : ""), def.color);
    if (id === "shield") this.player.shield = true;
    else this.effects[id] = def.dur;
  },
  updateBattery() {
    this.battery = Math.max(0, this.battery - BATTERY_DRAIN * (1 + this.dist / 4200));
    if (this.battery > 0 && this.battery <= 30 && !this.warned) {
      this.warned = true; Sound.play("warn"); App.toast("AKKU FAST LEER", C.magenta);
    }
    if (this.battery <= 0) {
      this.blind++;
      if (this.blind % 40 === 1) Sound.play("warn");
      if (this.blind >= BLIND_FRAMES) { this.player.hurt(); Sound.play("crash"); this.shake = 9; }
    }
  },
  updateCrash() {
    this.player.update(this.speed);
    this.speed *= 0.9;
    for (const o of this.objs) o.advance(this.speed);
    for (const p of this.picks) p.advance(this.speed);
    this.updateParts();
    if (this.player.crashT > 60 && !this.done && !App.popup) {
      if (Save.data.revives > 0 && !this.usedRevive) {
        App.openPopup(new Popup("WEITER?",
          ["Du hast " + Save.data.revives + " Revive" + (Save.data.revives > 1 ? "s" : "") + ".",
           "Einsetzen und weiterlaufen?"],
          [["REVIVE EINSETZEN", "revive", C.cyan], ["AUFGEBEN", "giveup", C.grey]],
          C.cyan, 236, "giveup"));
      } else if (this.player.crashT > 78) this.finish();
    }
  },
  finish() {
    if (this.done) return;
    this.done = true;
    App.go("gameover", {
      mode: this.mode, score: this.score, dist: Math.floor(this.dist),
      coins: this.coins, cause: this.blackout && this.battery <= 0 ? "battery" : "crash",
      revived: this.usedRevive,
    });
  },
  burst(o, color, n) {
    const p = project(o.z, o.lane - 1, o.h + 8);
    this.spawnParts(p.x, p.y, color, n);
  },
  burstAt(color, n) {
    const p = project(0, this.player.off, this.player.height + 8);
    this.spawnParts(p.x, p.y, color, n);
  },
  spawnParts(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.2832, s = 0.6 + Math.random() * 2.6;
      this.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.9,
                        life: 16 + Math.floor(Math.random() * 26), color });
    }
  },
  updateParts() {
    for (const p of this.parts) { p.x += p.vx; p.y += p.vy; p.vy += 0.13; p.life--; }
    this.parts = this.parts.filter(p => p.life > 0);
  },

  /* ---------------------------------------------------------- Zeichnen */
  draw() {
    let sx = 0, sy = 0;
    if (this.shake > 0.3) {
      sx = Math.round((Math.random() * 2 - 1) * this.shake);
      sy = Math.round((Math.random() * 2 - 1) * this.shake * 0.5);
      this.shake *= 0.86;
    }
    g.save(); g.translate(sx, sy);
    bgLayers(this.scroll, true);
    g.fillStyle = C.violet; g.fillRect(0, HORIZON - 1, VW, 1);
    this.drawRoad();
    this.drawWorld();
    this.drawParts();
    if (this.blackout) this.drawDarkness();
    g.restore();
    if (!this.blackout) vignette(0.5);
    if (this.hitFlash > 0) {
      g.save(); g.globalAlpha = this.hitFlash / 6 * 0.5;
      g.fillStyle = C.white; g.fillRect(0, 0, VW, VH); g.restore();
    }
    this.drawHUD();
    if (this.countdown > 0) this.drawCountdown();
  },
  /* Die Strasse wird zeilenweise gezeichnet: zu jeder Bildzeile wird die
     passende Tiefe zurueckgerechnet. So bleiben die Spurlinien lueckenlos
     statt treppenfoermig. */
  drawRoad() {
    g.fillStyle = C.near; g.fillRect(0, HORIZON, VW, VH - HORIZON);
    const span = GROUND - HORIZON;
    for (let y = HORIZON + 1; y < VH; y++) {
      const d = (y - HORIZON) / span;
      if (d <= 0) continue;
      const z = (1 / d - 1) / DEPTH_K;
      const w = ROAD_FAR + (ROAD_NEAR - ROAD_FAR) * d;
      const left = Math.round(CENTER - w / 2);
      const phase = Math.floor((z + this.scroll) / 4) & 1;
      g.fillStyle = phase ? C.track : "#271f4a";
      g.fillRect(left, y, Math.round(w) + 1, 1);
      const lw = Math.max(1, Math.round(d * 2));
      g.fillStyle = C.line;
      g.fillRect(Math.round(CENTER - w * 0.33) - (lw >> 1), y, lw, 1);
      g.fillRect(Math.round(CENTER + w * 0.33) - (lw >> 1), y, lw, 1);
      g.fillStyle = C.rail;
      g.fillRect(Math.round(CENTER - w * 0.5) - (lw >> 1), y, lw, 1);
      g.fillRect(Math.round(CENTER + w * 0.5) - (lw >> 1), y, lw, 1);
    }
  },
  drawWorld() {
    const all = this.objs.filter(o => o.alive || o.smashed > 0)
      .concat(this.picks.filter(p => p.alive));
    all.sort((a, b) => b.z - a.z);
    for (const o of all) {
      if (o.z > SPAWN_Z || o.z < DRAW_Z_MIN) continue;
      o.draw();
    }
    this.player.draw(this.skin);
  },
  drawParts() {
    for (const p of this.parts) {
      if (p.x < 0 || p.x >= VW || p.y < 0 || p.y >= VH) continue;
      g.fillStyle = p.color;
      const s = p.life > 22 ? 2 : 1;
      g.fillRect(Math.round(p.x), Math.round(p.y), s, s);
    }
  },
  drawDarkness() {
    const ratio = this.battery / BATTERY_MAX;
    let r = LIGHT_EMPTY + (LIGHT_FULL - LIGHT_EMPTY) * ratio;
    if (this.battery <= 0) {
      const f = Math.max(0, 1 - this.blind / BLIND_FRAMES);
      r = LIGHT_EMPTY * f * (0.75 + 0.25 * Math.sin(this.frames * 0.7));
    } else if (ratio < 0.3) r *= 0.92 + 0.08 * Math.sin(this.frames * 0.35);
    const p = project(0, this.player.off, this.player.height * 0.45);
    const cx = p.x, cy = p.y - LIGHT_AHEAD;
    if (r >= 8) {
      const rad = g.createRadialGradient(cx, cy, Math.max(1, r * 0.12), cx, cy, r);
      rad.addColorStop(0, "rgba(0,0,0,0)");
      rad.addColorStop(0.55, "rgba(0,0,0,0.55)");
      rad.addColorStop(1, "rgba(0,0,0,0.975)");
      g.fillStyle = rad; g.fillRect(0, 0, VW, VH);
    } else { g.fillStyle = "rgba(0,0,0,0.975)"; g.fillRect(0, 0, VW, VH); }
  },
  drawHUD() {
    text(String(this.score).padStart(7, "0"), 8, 7, 2, C.white, "left", C.cyan);
    text(Math.floor(this.dist) + " M", 8, 24, 1, C.light);
    // Coins rechts oben, waechst nach links
    const ct = String(this.coins);
    const r = text(ct, VW - 8, 8, 2, C.amber, "right");
    g.drawImage(SPR.coin, r.x - 12, 7, 8, 8);
    text(MODE_INFO[this.mode].label, VW - 8, 25, 1, C.grey, "right");

    // Punch-Abklingzeit: der Balken sagt, wann der naechste Schlag sitzt.
    const ready = this.player.cool <= 0;
    const bx = 8, by = VH - 29, bw = 62, bh = 20;
    panel(bx, by, bw, bh, C.dark, ready ? C.magenta : C.grey, 0.82, 2);
    text("PUNCH", bx + 5, by + 4, 1, ready ? C.magenta : C.grey);
    const frac = ready ? 1 : 1 - this.player.cool / PUNCH_COOLDOWN;
    g.fillStyle = C.near; g.fillRect(bx + 5, by + 13, bw - 10, 3);
    g.fillStyle = ready ? C.magenta : C.violet;
    g.fillRect(bx + 5, by + 13, Math.round((bw - 10) * frac), 3);

    // Laufende Effekte
    let y = 38;
    if (this.player.shield) { text("SCHILD", 8, y, 1, C.lime); y += 11; }
    for (const k in this.effects) {
      const d = POWERS[k];
      text(d.name, 8, y, 1, d.color);
      g.fillStyle = C.near; g.fillRect(8, y + 9, 46, 3);
      g.fillStyle = d.color; g.fillRect(8, y + 9, Math.round(46 * this.effects[k] / (d.dur || 1)), 3);
      y += 16;
    }
    if (this.player.combo > 1)
      text("COMBO x" + this.player.combo, VW - 8, 38, 1, C.lime, "right");
    if (this.blackout) this.drawBattery();
    // Pause-Knopf oben links wie in der Skizze - auch antippbar
    panel(VW/2 - 9, 6, 18, 14, C.dark, C.grey, 0.8, 2);
    g.fillStyle = C.light; g.fillRect(VW/2 - 4, 9, 3, 8); g.fillRect(VW/2 + 1, 9, 3, 8);
  },
  drawBattery() {
    const ratio = this.battery / BATTERY_MAX;
    const x = VW/2 - 44, y = VH - 22, w = 88, h = 9;
    panel(x - 3, y - 3, w + 6, h + 6, C.dark, C.grey, 0.85, 2);
    const col = ratio > 0.5 ? C.lime : ratio > 0.25 ? C.amber : C.magenta;
    const segs = 16, filled = Math.round(segs * ratio);
    for (let i = 0; i < segs; i++) {
      let c = i < filled ? col : C.near;
      if (i < filled && ratio <= 0.25 && ((this.frames / 12) | 0) % 2 === 0) c = C.dark;
      g.fillStyle = c; g.fillRect(x + 3 + i * 5, y + 2, 4, h - 4);
    }
    text("AKKU", x + w/2, y - 12, 1, col, "center");
    if (this.battery <= 0) {
      const left = (BLIND_FRAMES - this.blind) / 60;
      text("BLIND! " + Math.max(0, left).toFixed(1) + " S", VW/2, VH - 44, 2,
           C.magenta, "center", C.magenta);
    }
  },
  drawCountdown() {
    g.save(); g.globalAlpha = 0.42; g.fillStyle = "#000"; g.fillRect(0, 0, VW, VH); g.restore();
    const sec = Math.floor(this.countdown / 40);
    const t = ["LOS", "1", "2", "3", "3"][Math.min(4, sec)];
    const phase = (this.countdown % 40) / 40;
    const s = 5 + Math.floor(phase * 3);
    const col = t === "LOS" ? C.lime : C.cyan;
    text(t, VW/2, VH/2 - 20, s, col, "center", col);
    if (this.frames < 240)
      text("WISCHEN ODER PFEILE   TIPPEN ODER X = PUNCH", VW/2, VH - 50, 1, C.light, "center");
  },
};

/* ---------------------------------------------------------- Game Over */
const CAUSE = {
  crash: "DU BIST IN EIN HINDERNIS GELAUFEN",
  battery: "DER AKKU WAR LEER - DAS LICHT GING AUS",
};
SCENES.gameover = {
  music: "menu", sel: 0, scroll: 0, backAction: "menu",
  buttons: [
    new Button(VW/2 - 100, 150, 200, 22, "PLAY AGAIN", "again", C.lime, 2),
    new Button(14, 178, 108, 20, "MODUS WECHSELN", "swap", C.violet, 1),
    new Button(126, 178, 108, 20, "GLUECKSRAD", "wheel", C.amber, 1),
    new Button(238, 178, 108, 20, "HOME", "menu", C.cyan, 1),
    new Button(350, 178, 116, 20, "NOCH EINMAL?", "again2", C.grey, 1),
  ],
  enter(o) {
    this.mode = o.mode || "endless";
    this.score = o.score | 0; this.dist = o.dist | 0; this.coins = o.coins | 0;
    this.cause = o.cause || "crash"; this.revived = !!o.revived;
    this.reveal = 0; this.confetti = []; this.sel = 0;
    this.buttons.forEach((b, i) => b.hover = i === 0);
    this.buttons[4].label = "COINS: " + Save.data.coins;
    this.buttons[4].enabled = false;

    const d = Save.data;
    d.coins += this.coins; d.runs++;
    this.isRecord = this.score > d.best[this.mode];
    if (this.isRecord) d.best[this.mode] = this.score;
    Save.commit();

    if (this.isRecord && this.score > 0) {
      Sound.play("fanfare");
      for (let i = 0; i < 90; i++)
        this.confetti.push({ x: Math.random() * VW, y: -Math.random() * VH,
          vx: (Math.random() - .5) * .8, vy: .7 + Math.random() * 1.5,
          c: [C.magenta, C.cyan, C.lime, C.amber, C.violet][Math.floor(Math.random() * 5)],
          p: Math.random() * 6.28 });
      App.openPopup(new Popup("NEW HIGHSCORE",
        [MODE_INFO[this.mode].label + ": " + this.score + " PUNKTE",
         "Das ist deine neue Bestleistung."],
        [["STARK!", "close", C.lime], ["GLUECKSRAD", "wheel", C.amber]],
        C.lime, 240, "close"));
    }
  },
  popupAction(a) { if (a === "wheel") { App.closePopup(); App.go("wheel"); } },
  act(a) {
    if (a === "again" || a === "again2") App.go("play", { mode: this.mode });
    else if (a === "swap") App.go("play", { mode: this.mode === "endless" ? "blackout" : "endless" });
    else if (a === "wheel") App.go("wheel");
    else if (a === "menu") App.go("menu");
  },
  update(actions) {
    this.scroll += 0.35;
    if (this.reveal < this.score) this.reveal = Math.min(this.score, this.reveal + Math.max(1, this.score / 45 | 0));
    for (const f of this.confetti) {
      f.x += f.vx + Math.sin(f.p) * 0.5; f.y += f.vy; f.p += 0.08;
      if (f.y > VH) { f.y = -4; f.x = Math.random() * VW; }
    }
    menuInput(this, actions);
  },
  draw() {
    menuBackground(this.scroll);
    const col = this.cause === "crash" ? C.magenta : C.violet;
    const bob = Math.sin(this.scroll * 0.04) * 1.5;
    text(this.isRecord ? "NEW HIGHSCORE" : "GAME OVER", VW/2, 12 + bob,
         this.isRecord ? 3 : 4, C.white, "center", this.isRecord ? C.lime : col);
    text(CAUSE[this.cause] || "", VW/2, 44, 1, col, "center");
    const R = { x:90, y:56, w:300, h:84 };
    const mc = MODE_INFO[this.mode].color;
    panel(R.x, R.y, R.w, R.h, C.dark, mc, 0.94);
    text(MODE_INFO[this.mode].label, R.x + R.w/2, R.y + 6, 1, mc, "center");
    text(String(this.reveal), R.x + R.w/2, R.y + 18, 4, C.white, "center", mc);
    text("PUNKTE", R.x + R.w/2, R.y + 50, 1, C.grey, "center");
    text("STRECKE", R.x + 16, R.y + R.h - 22, 1, C.grey);
    text(this.dist + " M", R.x + 16, R.y + R.h - 12, 1, C.light);
    text("COINS", R.x + R.w/2, R.y + R.h - 22, 1, C.grey, "center");
    text("+" + this.coins, R.x + R.w/2, R.y + R.h - 12, 1, C.amber, "center");
    text("REKORD", R.x + R.w - 16, R.y + R.h - 22, 1, C.grey, "right");
    text(String(Save.data.best[this.mode]), R.x + R.w - 16, R.y + R.h - 12, 1,
         this.isRecord ? C.lime : C.light, "right");
    if (this.revived) text("MIT REVIVE", R.x + R.w/2, R.y - 10, 1, C.cyan, "center");
    this.buttons.forEach(b => b.draw(App.frame));
    footer("PFEILE ODER TIPPEN   ENTER BESTAETIGT");
    for (const f of this.confetti) { g.fillStyle = f.c; g.fillRect(f.x | 0, f.y | 0, 2, 3); }
    vignette(0.5);
  },
};

/* ====================================================================== */
/*  HAUPTSCHLEIFE                                                         */
/* ====================================================================== */
function handlePopup(actions) {
  const p = App.popup;
  const pt = Input.pointer;
  p.hover(pt.x, pt.y);
  for (const a of actions) {
    let act = null;
    if (typeof a === "object") {
      if (a.type === "tap") act = p.hitTest(a.x, a.y);
      else continue;
    }
    else if (a === "up" || a === "left") { p.move(-1); continue; }
    else if (a === "down" || a === "right") { p.move(1); continue; }
    else if (a === "confirm") { act = p.activate(); Sound.play("click"); }
    else if (a === "back" || a === "pause") act = p.onCancel || "close";
    else if (a === "mute") { toggleMute(); continue; }
    if (!act) continue;
    Sound.play("click");
    if (act === "close") { App.closePopup(); return; }
    App.scene.popupAction?.(act);
    if (App.popup === p && act !== "close") {
      // Aktionen, die kein Szenen-Handler kennt, schliessen das Pop-up.
      if (!App.scene.popupAction) App.closePopup();
    }
    return;
  }
}

let lastT = performance.now(), acc = 0;
const STEP = 1000 / 60;

function frame(now) {
  requestAnimationFrame(frame);
  acc += Math.min(200, now - lastT); lastT = now;
  let guard = 0;
  while (acc >= STEP && guard++ < 5) {
    acc -= STEP;
    App.frame++;
    const actions = Input.take();
    if (App.popup) handlePopup(actions);
    else App.scene.update(actions);
    for (let i = App.toasts.length - 1; i >= 0; i--) {
      App.toasts[i].age++;
      if (!App.toasts[i].alive) App.toasts.splice(i, 1);
    }
  }
  App.scene.draw();
  App.toasts.forEach((t, i) => t.draw(i));
  if (App.popup) App.popup.draw(App.frame);
  ctx.drawImage(buf, 0, 0, cvs.width, cvs.height);
}

/* --------------------------------------------------------------- Start */
function start(restored) {
  buildSprites();
  buildBackground();
  resize();
  Save.applySettings();
  document.getElementById("boot")?.remove();
  App.go(restored?.scene === "menu" || !restored?.scene ? "menu" : "menu");
  requestAnimationFrame(frame);
  // Fortschritt geraeteuebergreifend nachladen, sobald verfuegbar.
  Save.connect().then(() => {});
}

/* Wird die Seite neu veroeffentlicht, waehrend jemand spielt, sollen die
   Einstellungen und der Fortschritt nicht verloren gehen. */
window.claude?.hot?.snapshot?.(() => ({ scene: "menu" }));
if (window.claude?.hot?.ready) window.claude.hot.ready(start);
else start(window.claude?.hot?.data || {});
</script>
